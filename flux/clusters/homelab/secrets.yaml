# The store and ExternalSecrets need the operator's CRDs, so they apply after it.
# No `wait`: the store only turns ready once the Doppler token Secret exists.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secrets
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: external-secrets
  path: ./flux/secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
