apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: tailscale-operator
      version: 1.104.2
      sourceRef:
        kind: HelmRepository
        name: tailscale
  install:
    remediation:
      retries: -1           # keep retrying until the operator-oauth Secret exists
  upgrade:
    remediation:
      retries: 3
  # The OAuth client is read from a Secret named operator-oauth (keys client_id and
  # client_secret) that is created by hand, so no credentials appear here.
  values:
    operatorConfig:
      hostname: homelab-operator
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/hostname: coop
      resources:
        requests: { cpu: 10m, memory: 64Mi }
