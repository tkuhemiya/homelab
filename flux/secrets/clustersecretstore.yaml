# One Doppler store for the whole cluster. It reads the homelab project's prd config
# with a read-only service token, the one Secret in the cluster created by hand:
#   kubectl -n external-secrets create secret generic doppler-token --from-file=dopplerToken=...
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: doppler
spec:
  provider:
    doppler:
      auth:
        secretRef:
          dopplerToken:
            name: doppler-token
            key: dopplerToken
            namespace: external-secrets
